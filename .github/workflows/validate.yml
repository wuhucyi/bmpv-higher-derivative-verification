name: validate two-audience research artifact

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structural-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Validate structure, claims, evidence, and PDFs
        run: ruby for_ai/validate_level1.rb
